# https://taskfile.dev

version: "3"

vars:
  BINARY_NAME: birda
  # The flags the Lint job in .github/workflows/ci.yml passes to clippy. CI
  # builds CPU-only, --all-targets lints test code too, and gen-registry brings
  # the feature-gated registry generator into scope.
  CLIPPY_FLAGS: --no-default-features --features gen-registry --all-targets

# Cross-compilation notes:
# - Native builds include CUDA support by default
# - Cross-compilation builds are CPU-only (--no-default-features)
# - Linux ARM64: requires `gcc-aarch64-linux-gnu` package
# - macOS targets: requires macOS SDK (osxcross) or build on macOS
# - Windows GNU: requires `mingw-w64` package

tasks:
  default:
    desc: Run all checks (fmt, clippy, tests, registry)
    cmds:
      - task: check

  check:
    desc: Run the checks CI runs, except the MSRV job
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test
      - task: test:registry

  fmt:
    desc: Format code with rustfmt
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check code formatting
    cmds:
      - cargo fmt --check

  clippy:
    desc: Run clippy on all targets with CI's flags and strict warnings
    cmds:
      - cargo clippy {{.CLIPPY_FLAGS}} -- -D warnings

  clippy:fix:
    desc: Run clippy with CI's flags and apply automatic fixes
    cmds:
      - cargo clippy {{.CLIPPY_FLAGS}} --fix --allow-dirty --allow-staged

  test:
    desc: Run tests on a CPU-only build, as CI does
    cmds:
      - cargo test --no-default-features

  # The generator and its drift test sit behind the gen-registry feature, so
  # the test task above never reaches them. CI runs these two as its own step.
  test:registry:
    desc: Test the registry generator and check registry.json is up to date
    cmds:
      - cargo test --no-default-features --features gen-registry --lib gen_registry
      - cargo test --no-default-features --features gen-registry --test registry_generation

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test --no-default-features -- --nocapture

  build:
    desc: Build for current platform (debug, with CUDA)
    cmds:
      - cargo build

  build:release:
    desc: Build for current platform (release, with CUDA)
    cmds:
      - cargo build --release

  build:cpu:
    desc: Build for current platform (release, CPU-only)
    cmds:
      - cargo build --release --no-default-features

  # Cross-compilation targets (CPU-only, no CUDA)
  # These require appropriate toolchains installed

  build:linux-x64:
    desc: Build for Linux x86_64 (with CUDA)
    vars:
      TARGET: x86_64-unknown-linux-gnu
    cmds:
      - rustup target add {{.TARGET}} 2>/dev/null || true
      - cargo build --release --target {{.TARGET}}

  build:linux-arm64:
    desc: Build for Linux ARM64 (CPU-only, requires gcc-aarch64-linux-gnu)
    vars:
      TARGET: aarch64-unknown-linux-gnu
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    cmds:
      - rustup target add {{.TARGET}} 2>/dev/null || true
      - cargo build --release --no-default-features --target {{.TARGET}}

  build:macos-x64:
    desc: Build for macOS x86_64 (CPU-only, requires osxcross or native macOS)
    vars:
      TARGET: x86_64-apple-darwin
    cmds:
      - rustup target add {{.TARGET}} 2>/dev/null || true
      - cargo build --release --no-default-features --target {{.TARGET}}

  build:macos-arm64:
    desc: Build for macOS ARM64 (CPU-only, requires osxcross or native macOS)
    vars:
      TARGET: aarch64-apple-darwin
    cmds:
      - rustup target add {{.TARGET}} 2>/dev/null || true
      - cargo build --release --no-default-features --target {{.TARGET}}

  build:windows-x64:
    desc: Build for Windows x86_64 (CPU-only, requires mingw-w64)
    vars:
      TARGET: x86_64-pc-windows-gnu
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    cmds:
      - rustup target add {{.TARGET}} 2>/dev/null || true
      - cargo build --release --no-default-features --target {{.TARGET}}

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  doc:
    desc: Generate documentation
    cmds:
      - cargo doc --no-deps

  doc:open:
    desc: Generate and open documentation
    cmds:
      - cargo doc --no-deps --open

  run:
    desc: Run birda with arguments
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  install:
    desc: Install birda to ~/.cargo/bin
    cmds:
      - cargo install --path .

  # CI-specific tasks
  ci:
    desc: Run the CI checks, then a release build and the docs
    cmds:
      - task: fmt:check
      - task: clippy
      - task: ci:test
      - task: build:release
      - task: doc

  ci:lint:
    desc: Run linting checks for CI
    cmds:
      - task: fmt:check
      - task: clippy

  ci:test:
    desc: Run tests as the CI Test job does
    cmds:
      - cargo test --no-default-features --no-fail-fast
      - cargo test --no-default-features --features gen-registry --no-fail-fast --lib gen_registry
      - cargo test --no-default-features --features gen-registry --no-fail-fast --test registry_generation

  # Development helpers
  watch:
    desc: Watch for changes and run checks
    cmds:
      - cargo watch -c -x "fmt" -x "clippy" -x "test"

  pre-commit:
    desc: Run before committing (alias for check)
    cmds:
      - task: check

  install-hooks:
    desc: Install git hooks (pre-commit with fmt, clippy, actionlint)
    cmds:
      - |
        echo "Installing git hooks..."
        cp hooks/pre-commit .git/hooks/pre-commit
        chmod +x .git/hooks/pre-commit
        echo "✅ Git hooks installed successfully!"
        echo "Pre-commit hook will run: cargo fmt --check, cargo clippy, actionlint"

  uninstall-hooks:
    desc: Uninstall git hooks
    cmds:
      - |
        echo "Uninstalling git hooks..."
        rm -f .git/hooks/pre-commit
        echo "✅ Git hooks uninstalled"

  # Cross-compilation setup helpers
  setup:cross-linux-arm64:
    desc: Install Linux ARM64 cross-compiler (Debian/Ubuntu)
    cmds:
      - sudo apt-get install -y gcc-aarch64-linux-gnu

  setup:cross-windows:
    desc: Install Windows cross-compiler (Debian/Ubuntu)
    cmds:
      - sudo apt-get install -y mingw-w64
